<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>관리자 로그인 - CrossFit Beginner Mate</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@1.3.9/dist/web/static/pretendard.css" />
  <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <main class="login-container">
    <span class="app-wordmark login-wordmark">Crossfit Beginner Mate<span class="app-wordmark-tag">Admin</span></span>
    <h1>관리자 로그인</h1>
    <form id="login-form">
      <div class="field">
        <label for="password">비밀번호</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required />
      </div>
      <p class="error-text hidden" id="error-text"></p>
      <button type="submit" class="btn-primary login-submit">로그인</button>
    </form>
  </main>

  <script src="/admin/login.js"></script>
</body>
</html>
