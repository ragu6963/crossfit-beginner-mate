<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>관리자 로그인 - CrossFit Beginner Mate</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@1.3.9/dist/web/static/pretendard.css" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <main class="login-container">
    <h1 style="margin-bottom: 24px;">관리자 로그인</h1>
    <form id="login-form">
      <div class="field">
        <label for="password">비밀번호</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required />
      </div>
      <p class="error-text hidden" id="error-text"></p>
      <button type="submit" class="btn-primary" style="width:100%;">로그인</button>
    </form>
  </main>

  <script src="/admin/login.js"></script>
</body>
</html>
