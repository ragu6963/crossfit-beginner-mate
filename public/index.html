<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CrossFit Beginner Mate</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@1.3.9/dist/web/static/pretendard.css" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <main class="container">
    <h1 id="selected-date-title" class="page-date-title"></h1>

    <div class="week-strip-wrapper">
      <div class="week-strip" id="week-strip"></div>
    </div>

    <div class="content-viewport">
      <div id="content"></div>
    </div>
  </main>

  <div class="detail-backdrop" id="detail-backdrop">
    <div class="detail-panel" id="detail-panel">
      <div class="detail-panel-handle"></div>
      <div class="detail-panel-header">
        <div>
          <span class="class-type-name" id="detail-class-type"></span>
        </div>
        <button type="button" class="detail-close-btn" id="detail-close-btn" aria-label="닫기">✕</button>
      </div>
      <pre class="raw-wod" id="detail-raw-wod"></pre>
      <div id="detail-guide"></div>
    </div>
  </div>

  <script src="/shared.js"></script>
  <script src="/app.js"></script>
</body>
</html>
